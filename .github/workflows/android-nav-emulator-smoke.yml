name: Android-nav cloud emulator smoke test

on:
  workflow_dispatch:
    inputs:
      android_nav_run_id:
        description: "Successful Android-nav Actions run ID containing the x86_64 emulator APK"
        required: true
        default: "44998552450"
        type: string
      expected_source_sha:
        description: "Expected Android-nav source commit SHA (40 hex characters)"
        required: true
        default: "31dbb27aa81cc37b889a01610aab3db23aecc560"
        type: string

permissions:
  contents: read

concurrency:
  group: android-nav-emulator-smoke
  cancel-in-progress: false

jobs:
  emulator-smoke:
    # This job is deliberately manual-only. Never add pull_request or pull_request_target.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_NAV_REPO: scollorec/Android-nav
      ARTIFACT_NAME: android-nav-emulator-x86_64-release-apk
      EXPECTED_PACKAGE: com.scollorec.androidnav.emulator
      EXPECTED_APK: Android-Nav-emulator-x86_64.apk
      RUN_ID: ${{ inputs.android_nav_run_id || '44998552450' }}
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha || '31dbb27aa81cc37b889a01610aab3db23aecc560' }}
    steps:
      - name: Validate inputs and secret availability
        shell: bash
        env:
          ANDROID_NAV_READ_TOKEN: ${{ secrets.ANDROID_NAV_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]{6,20}$ ]] || { echo "::error::Invalid workflow run ID"; exit 1; }
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::Expected source SHA must be 40 hexadecimal characters"; exit 1; }
          [[ -n "${ANDROID_NAV_READ_TOKEN:-}" ]] || {
            echo "::error::Missing repository Actions secret ANDROID_NAV_READ_TOKEN."
            echo "Create a fine-grained token limited to scollorec/Android-nav with Actions: Read, then add it as this lab repository's Actions secret."
            exit 1
          }

      - name: Validate source workflow run and download its artifact
        shell: bash
        env:
          ANDROID_NAV_READ_TOKEN: ${{ secrets.ANDROID_NAV_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p evidence/apk
          api="https://api.github.com/repos/$ANDROID_NAV_REPO"
          headers=(-H "Accept: application/vnd.github+json"
                   -H "Authorization: Bearer $ANDROID_NAV_READ_TOKEN"
                   -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail-with-body --silent --show-error "${headers[@]}" "$api/actions/runs/$RUN_ID" -o run.json
          jq -e --arg sha "$EXPECTED_SOURCE_SHA" '
            .id and .status == "completed" and .conclusion == "success"
            and (.head_sha | ascii_downcase) == ($sha | ascii_downcase)
            and (.head_branch == "feature/t1-tesla-experience")
            and (.event == "push" or .event == "workflow_dispatch")
          ' run.json >/dev/null || {
            echo "::error::Run must be successful, completed, from the trusted feature/t1-tesla-experience branch, and match expected SHA."
            jq '{id,status,conclusion,event,head_branch,head_sha}' run.json
            exit 1
          }
          jq '{run_id:.id,source_sha:.head_sha,branch:.head_branch,event:.event,workflow:.name}' run.json > evidence/source-run.json

          curl --fail-with-body --silent --show-error "${headers[@]}" "$api/actions/runs/$RUN_ID/artifacts" -o artifacts.json
          artifact="$(jq -ce --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0] else error("Expected exactly one unexpired emulator artifact") end' artifacts.json)"
          artifact_id="$(jq -r '.id' <<<"$artifact")"
          expected_zip_digest="$(jq -r '.digest // empty' <<<"$artifact")"
          [[ -n "$expected_zip_digest" ]] || { echo "::error::Artifact API did not provide a digest"; exit 1; }
          curl --location --fail-with-body --silent --show-error "${headers[@]}" "$api/actions/artifacts/$artifact_id/zip" -o evidence/apk/artifact.zip
          actual_zip_digest="sha256:$(sha256sum evidence/apk/artifact.zip | cut -d' ' -f1)"
          [[ "$actual_zip_digest" == "$expected_zip_digest" ]] || { echo "::error::Artifact ZIP digest mismatch"; exit 1; }
          echo "$actual_zip_digest" > evidence/apk/artifact-zip.sha256
          unzip -q evidence/apk/artifact.zip -d evidence/apk/unpacked
          apk_path="$(find evidence/apk/unpacked -type f -name "$EXPECTED_APK" -print -quit)"
          [[ -n "$apk_path" ]] || { echo "::error::Expected APK not found in artifact"; exit 1; }
          cp "$apk_path" evidence/apk/"$EXPECTED_APK"
          echo "APK_PATH=evidence/apk/$EXPECTED_APK" >> "$GITHUB_ENV"
          echo "ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "ARTIFACT_EXPIRES_AT=$(jq -r '.expires_at' <<<"$artifact")" >> "$GITHUB_ENV"
          {
            echo "artifact_name=$ARTIFACT_NAME"
            echo "artifact_id=$artifact_id"
            echo "artifact_digest=$actual_zip_digest"
            echo "source_sha=$(jq -r '.head_sha' run.json)"
            echo "artifact_expires_at=$(jq -r '.expires_at' <<<"$artifact")"
          } >> evidence/artifact-metadata.txt

      # GitHub's ubuntu-24.04 runner already includes the Android SDK,
      # platform-tools and build-tools. Avoid setup-android@v3 here: it
      # still unconditionally requests the removed legacy SDK package "tools".
      # reactivecircus/android-emulator-runner installs the requested image.

      - name: Verify APK package, ABI and checksum
        shell: bash
        run: |
          set -euo pipefail
          aapt_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          [[ -x "$aapt_path" ]] || { echo "::error::aapt not found"; exit 1; }
          package="$("$aapt_path" dump badging "$APK_PATH" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -1)"
          [[ "$package" == "$EXPECTED_PACKAGE" ]] || { echo "::error::Unexpected APK package: $package"; exit 1; }
          unzip -Z1 "$APK_PATH" | grep -q '^lib/x86_64/' || { echo "::error::APK does not contain x86_64 native libraries"; exit 1; }
          sha256sum "$APK_PATH" | tee evidence/apk/apk.sha256
          "$aapt_path" dump badging "$APK_PATH" | sed -n '1,3p' > evidence/apk/apk-badging.txt
          {
            echo "package=$package"
            echo "abi=x86_64"
            echo "apk_sha256=$(cut -d' ' -f1 evidence/apk/apk.sha256)"
          } >> evidence/apk-verification.txt

      - name: Boot Android x86_64 emulator and run smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p evidence/screenshots
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            adb shell settings put system accelerometer_rotation 0
            adb install -r "$APK_PATH"
            adb shell monkey -p "$EXPECTED_PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell dumpsys activity activities > evidence/activities.txt
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml evidence/window.xml
            adb exec-out screencap -p > evidence/screenshots/launch.png
            adb logcat -d -t 12000 > evidence/logcat.txt
            grep -q "$EXPECTED_PACKAGE" evidence/activities.txt
            cat > evidence/junit-smoke.xml <<'XML'
            <?xml version="1.0" encoding="UTF-8"?>
            <testsuite name="android-nav-cloud-smoke" tests="2" failures="0" errors="0" skipped="0">
              <testcase classname="android.nav.smoke" name="apk_installed"/>
              <testcase classname="android.nav.smoke" name="launcher_activity_started"/>
            </testsuite>
            XML
            echo "Smoke test passed: package installed, launcher started, screenshot captured."

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-nav-ux-smoke-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 5
